<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="utf-8" />
    <!-- Viewport para comportamento igual app nativa -->
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />

    <!-- Manifest PWA — habilita instalar como app -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link rel="icon" type="image/png" href="%PUBLIC_URL%/nickyLogov2png.png" />

    <!-- iOS Apple Web App -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Nicky Anime" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/nickyLogov2png.png" />

    <!-- Theme — barra de status e navegador -->
    <meta name="theme-color" content="#667eea" />

    <meta
      name="description"
      content="Nicky Anime - Pesquisa animes e guarda os teus favoritos"
    />
    <title>Nicky Anime</title>
  </head>
  <body>
    <noscript>É necessário ter JavaScript ativado para usar esta aplicação.</noscript>
    <div id="root"></div>
    <script>
      // Registar Service Worker para funcionar offline
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(err => {
            // Erro no registo do SW não é crítico — a app continua a funcionar
          });
        });
      }
    </script>
  </body>
</html>
