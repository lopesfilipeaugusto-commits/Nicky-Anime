  <script type="text/babel">

    /**
     * ARQUITETURA APP REACT
     * 
     * Componentes (Arquitetura Componentizada):
     * â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
     * App (gerencia estado global)
     *  â”œ Header (logo + tÃ­tulo)
     *  â”œ SearchBox (input + botÃµes)
     *  â”œ QuickSuggestions (carousel)
     *  â”œ AnimeCard (detalhe + botÃ£o favorito)
     *  â”œ ResultsList (animes relacionados)
     *  â”” FavoritesList (favoritos com toggle)
     * 
     * Estado Global:
     * â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
     * - currentAnime: anime selecionado (null | object)
     * - searchResults: animes encontrados (array)
     * - favorites: lista de favoritos (array, sincroniza localStorage)
     * - quickSuggestions: carousel (array)
     * - historyStack: histÃ³rico de navegaÃ§Ã£o (array)
     * - user: dados do utilizador (null | {name, email})
     * - isLoading: indicador de carregamento (bool)
     */

    // ========== CONSTANTS ==========
    // Aqui guardamos os atalhos de animes populares (nome => ID da Jikan API)
    // Quando pesquisas "death note", vai direto ao ID 1535 em vez de fazer uma busca

    const ANIME_SHORTCUTS = {
      "death note": 1535, "attack on titan": 16498, "shingeki no kyojin": 16498,
      "naruto": 20, "one piece": 21, "bleach": 15, "demon slayer": 38000,
      "kimetsu no yaiba": 38000, "jujutsu kaisen": 40748, "code geass": 1575,
      "steins gate": 9253, "fullmetal alchemist": 121, "cowboy bebop": 1,
      "evangelion": 30, "monster": 19, "hunter x hunter": 136, "vinland saga": 37521,
      "spy x family": 50595, "chainsaw man": 44511, "one punch man": 30656,
      "sword art online": 25739, "no game no life": 33674, "haikyuu": 33096,
      "food wars": 32629, "oregairu": 27813, "silent voice": 56044, "koe no katachi": 56044
    };

    // ========== HELPERS ==========
    // FunÃ§Ãµes auxiliares para simplificar operaÃ§Ãµes comuns

    // Verifica se uma string Ã© um nÃºmero (usado para pesquisa por ID de anime)
    function isNumeric(str) {
      return !isNaN(str) && !isNaN(parseFloat(str));
    }

    // Calcula quÃ£o semelhante sÃ£o dois textos (para ordenar resultados de pesquisa)
    // Retorna um valor entre 0 e 1 (1 = idÃªntico, 0 = totalmente diferente)
    function calculateSimilarity(str1, str2) {
      const s1 = (str1 || "").toLowerCase();
      const s2 = (str2 || "").toLowerCase();
      if (s1 === s2) return 1.0;
      if (s1.includes(s2) || s2.includes(s1)) return 0.8;
      let matches = 0;
      for (let i = 0; i < Math.min(s1.length, s2.length); i++) {
        if (s1[i] === s2[i]) matches++;
      }
      return matches / Math.max(s1.length, s2.length);
    }

    // Extrai informaÃ§Ãµes de temporada do tÃ­tulo do anime (ex: "Attack on Titan Season 2" => "Season 2")
    function getSeasonLabel(title) {
      if (!title) return "";
      const t = title.toLowerCase();
      if (t.match(/season\s*3|3rd\s*season|s\s*3/)) return "Season 3";
      if (t.match(/season\s*2|2nd\s*season|s\s*2/)) return "Season 2";
      return "";
    }

    // Normaliza o tÃ­tulo para comparaÃ§Ã£o (remove temporadas, nÃºmeros e caracteres especiais)
    // Exemplo: "Attack on Titan Season 2 (2013)" => "attack on titan"
    function normalizeBaseTitle(title) {
      if (!title) return "";
      return title.toLowerCase()
        .replace(/\([^\)]*\)/g, " ")
        .replace(/season\s*\d+|\d+nd\s*season|\d+rd\s*season/g, " ")
        .replace(/final\s*season|part\s*\d+|cour\s*\d+/g, " ")
        .replace(/\b\d+\b/g, " ")
        .replace(/\s+/g, " ")
        .trim();
    }

    function shuffleList(list) {
      const arr = list.slice();
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    // ========== LOCALSTORAGE FUNCTIONS ==========
    // Guardam e carregam dados no navegador (persistem mesmo apÃ³s fechar a app)

    // Carrega a lista de favoritos do localStorage
    // Retorna um array vazio se nÃ£o existirem favoritos ou se houver erro
    function getFavorites() {
      try {
        return JSON.parse(localStorage.getItem("animeFavorites")) || [];
      } catch {
        return [];
      }
    }

    // Guarda a lista de favoritos no localStorage
    function setFavorites(list) {
      localStorage.setItem("animeFavorites", JSON.stringify(list));
    }

    // Verifica se um anime (pelo ID) jÃ¡ estÃ¡ nos favoritos
    function isFavorite(id) {
      return getFavorites().some(a => a.mal_id === id);
    }

    // Carrega os dados do utilizador (nome e email do login)
    // ATUALIZAÃ‡ÃƒO: localStorage key mudou de "nickelUser" para "nickyUser" para consistÃªncia de branding
    function loadUser() {
      try {
        return JSON.parse(localStorage.getItem("nickyUser")) || null;
      } catch {
        return null;
      }
    }

    // Guarda os dados do utilizador no localStorage
    // ATUALIZAÃ‡ÃƒO: localStorage key mudou de "nickelUser" para "nickyUser"
    function saveUser(user) {
      localStorage.setItem("nickyUser", JSON.stringify(user));
    }

    function clearUser() {
      localStorage.removeItem("nickyUser");
    }

    function loadSavedAccounts() {
      try {
        return JSON.parse(localStorage.getItem("nickySavedAccounts")) || [];
      } catch {
        return [];
      }
    }

    function saveSavedAccounts(list) {
      localStorage.setItem("nickySavedAccounts", JSON.stringify(list));
    }

    function rememberAccount(user) {
      if (!user?.name) return;
      const next = [
        user,
        ...loadSavedAccounts().filter(account =>
          (account.email || "").toLowerCase() !== (user.email || "").toLowerCase() || account.name !== user.name
        )
      ].slice(0, 5);
      saveSavedAccounts(next);
    }

    // ========== API FUNCTIONS ==========
    // FunÃ§Ãµes que fazem pedidos Ã  Jikan API (anime database) para obter dados

    /**
     * Pesquisa um anime por query (pode ser nome, ID, ou atalho)
     * - Se for atalho conhecido (ex: "death note"), vai direto ao ID
     * - Se for nÃºmero, trata como ID de anime
     * - Caso contrÃ¡rio, faz busca por nome
     * Retorna: [animeSelected, resultsArray] - um array com o anime principal e resultados relacionados
     */
    async function fetchAnimeByQuery(query) {
      const q = String(query || "").trim();
      const qLower = q.toLowerCase();

      let url = "";
      if (ANIME_SHORTCUTS[qLower]) {
        // Se Ã© um atalho conhecido, usa o ID direto (mais rÃ¡pido)
        url = `https://api.jikan.moe/v4/anime/${ANIME_SHORTCUTS[qLower]}`;
      } else if (isNumeric(q)) {
        // Se Ã© um nÃºmero, trata como ID de anime
        url = `https://api.jikan.moe/v4/anime/${q}`;
      } else {
        // Caso contrÃ¡rio, faz uma busca por nome
        url = `https://api.jikan.moe/v4/anime?q=${encodeURIComponent(q)}`;
      }

      const response = await fetch(url, { headers: { "Cache-Control": "no-cache" } });
      if (!response.ok) throw new Error(`Erro HTTP ${response.status}`);

      const data = await response.json();
      if (!data.data) throw new Error("Sem dados");

      let selected = null;
      let results = [];

      if (Array.isArray(data.data)) {
        // Se recebeu mÃºltiplos resultados, ordena por similaridade
        if (data.data.length === 0) throw new Error("Nenhum anime encontrado");
        const sorted = data.data
          .map(item => ({ item, score: calculateSimilarity(qLower, item.title) }))
          .sort((a, b) => b.score - a.score)
          .map(x => x.item);
        selected = sorted[0]; // O primeiro (mais similar) Ã© o principal
        results = sorted.slice(1, 11); // Os restantes sÃ£o sugestÃµes
      } else {
        // Se recebeu apenas um resultado direto
        selected = data.data;
      }

      return [selected, results];
    }

    /**
     * Procura animes similares ao atual usando o tÃ­tulo como referÃªncia
     * Filtra resultados que tÃªm relaÃ§Ã£o com o tÃ­tulo normalizado (ex: outras temporadas)
     * Volta para o "Ver mais" quando clicas um anime
     */
    async function fetchSimilarByTitle(title, currentId) {
      if (!title) return [];
      try {
        const response = await fetch(`https://api.jikan.moe/v4/anime?q=${encodeURIComponent(title)}`, {
          headers: { "Cache-Control": "no-cache" }
        });
        if (!response.ok) return [];
        const data = await response.json();
        if (!Array.isArray(data.data)) return [];
        return data.data.filter(a => {
          if (a.mal_id === currentId) return false;
          const base = normalizeBaseTitle(a.title || a.title_english || "");
          return base && (base.includes(title) || title.includes(base));
        }).slice(0, 10);
      } catch {
        return [];
      }
    }

    /**
     * Carrega sugestÃµes rÃ¡pidas que aparecem no topo (carousel)
     * Mistura animes do top com animes aleatÃ³rios para dar variedade
     * O carousel roda automaticamente a cada 3.5 segundos
     */
    async function fetchQuickSuggestions(total = 6, topCount = 1) {
      const randomCount = Math.max(total - topCount, 0);

      const randomRequests = Array.from({ length: Math.max(randomCount * 2, 4) }, () =>
        fetch("https://api.jikan.moe/v4/random/anime")
          .then(res => res.ok ? res.json() : null)
          .then(data => data?.data || null)
          .catch(() => null)
      );

      const topResponse = await fetch("https://api.jikan.moe/v4/top/anime?limit=25");
      const topData = topResponse.ok ? await topResponse.json() : { data: [] };
      const topList = shuffleList(topData.data || []).slice(0, topCount);

      // Recolhe animes aleatÃ³rios em paralelo (mais rÃ¡pido que fazer pedidos sequenciais)
      const randomItems = await Promise.all(randomRequests);
      const uniq = new Map();
      randomItems.filter(Boolean).forEach(a => {
        if (!uniq.has(a.mal_id)) uniq.set(a.mal_id, a);
      });

      const randomList = shuffleList(Array.from(uniq.values())).slice(0, randomCount);

      // Mistura animes do top com aleatÃ³rios de forma equilibrada
      const mixed = [];
      let i = 0;
      while (mixed.length < total && (topList[i] || randomList[i])) {
        if (topList[i]) mixed.push(topList[i]);
        if (randomList[i] && mixed.length < total) mixed.push(randomList[i]);
        i++;
      }

      return mixed;
    }

    // QuickSuggestions: Carousel de animes recomendados que roda automaticamente
    // Props: items (array de animes), onSelect (funÃ§Ã£o ao clicar num anime)
    function QuickSuggestions({ items, onSelect, onRefresh }) {
      const [display, setDisplay] = React.useState(items);
      const timerRef = React.useRef(null);

      React.useEffect(() => {
        setDisplay(items);
        if (timerRef.current) clearInterval(timerRef.current);
        // Configura o carousel para rodar automaticamente a cada 3.5 segundos
        if (items.length > 1) {
          timerRef.current = setInterval(() => {
            setDisplay(prev => [...prev.slice(1), prev[0]]); // Move primeiro para o fim
          }, 3500);
        }
        return () => { if (timerRef.current) clearInterval(timerRef.current); };
      }, [items]);

      if (!display || display.length === 0) {
        return <div className="quick-suggestions"><small style={{color: '#999'}}>Sem sugestÃµes neste momento</small></div>;
      }

      return (
        <div className="quick-suggestions">
          {display.map(a => (
            <div key={a.mal_id} className="quick-item" onClick={() => onSelect(a)}>
              <img className="quick-thumb" src={a.images?.jpg?.small_image_url} alt={a.title} />
              <span>{a.title}</span>
            </div>
          ))}
          <button className="quick-next" onClick={() => setDisplay(p => [...p.slice(1), p[0]])}>→</button>
        </div>
      );
    }

    // AnimeCard: Mostra os detalhes completos de um anime (titulo, imagem, sinopse, botÃ£o favoritos)

    // ========== APP COMPONENT (Principal) ==========
    // Gere todo o estado da aplicaÃ§Ã£o e coordena todos os componentes
    function App() {
      // ESTADO GLOBAL DA APP:
      const [current, setCurrent] = React.useState(null); // Anime que se estÃ¡ a ver agora
      const [results, setResults] = React.useState([]); // Animes relacionados (ver mais)
      const [favs, setFavsState] = React.useState(getFavorites()); // Lista de favoritos (sincroniza com localStorage)
      const [quick, setQuick] = React.useState([]); // Carousel de sugestÃµes (topo da pÃ¡gina)
      const [history, setHistory] = React.useState([]); // HistÃ³rico para o botÃ£o "Voltar"

      const [savedAccounts, setSavedAccounts] = React.useState(loadSavedAccounts());
      const [loading, setLoading] = React.useState(false); // Indicador de carregamento (mostra "Carregando...")

      // Carrega o carousel de sugestÃµes ao abrir a app

        try {
          const suggestions = await fetchQuickSuggestions(6, 1);

      }, []);

      // Handler: quando faz pesquisa no input (Enter ou botÃ£o pesquisar)
      // Busca o anime e guarda no histÃ³rico
      const handleSearch = async (query) => {
        try {
          setLoading(true);
          const [anime, resultsArray] = await fetchAnimeByQuery(query);
          if (anime) {
            setCurrent(anime);
            setResults(resultsArray);
          }
        } catch (err) {
          alert("Erro: " + err.message);
        } finally {
          setLoading(false);
        }
      };

      // Handler: botÃ£o "Voltar" - volta para o anime anterior
      // Usa o histÃ³rico para saber qual era o anterior
      const handleGoBack = () => {
        if (history.length === 0) return;
        const newHistory = [...history];
        const prev = newHistory.pop();
        setCurrent(prev);
        setHistory(newHistory);
      };

      // Handler: quando clica num anime (dos resultados, favoritos, ou sugestÃµes)
      // Carrega esse anime como principal e procura animes similares para "Ver mais"
      const handleSelect = React.useCallback(async (anime) => {
        if (current && current.mal_id !== anime.mal_id) {
          setHistory(prev => [...prev, current]);
        }
        setCurrent(anime);

        try {
          const baseTitle = normalizeBaseTitle(anime.title || anime.title_english || "");
          const similar = await fetchSimilarByTitle(baseTitle, anime.mal_id);
          setResults(similar);
        } catch (err) {
          console.error("Similar fetch error:", err);
        }
      }, [current]);

      // Handler: adiciona um anime aos favoritos
      // Guarda tambÃ©m no localStorage para persistir dados
      const handleAddFav = (anime) => {
        if (!anime || isFavorite(anime.mal_id)) return;
        const newFavs = [{
          mal_id: anime.mal_id,
          title: anime.title || anime.title_english,
          image: anime.images?.jpg?.small_image_url || ""
        }, ...favs];
        setFavsState(newFavs);
        setFavorites(newFavs);
      };

      // Handler: remove um anime dos favoritos
      const handleRemFav = (id) => {
        const newFavs = favs.filter(a => a.mal_id !== id);
        setFavsState(newFavs);
        setFavorites(newFavs);
      };

      const handleLogin = (nextUser) => {
        if (!nextUser?.name) return;
        saveUser(nextUser);
        rememberAccount(nextUser);
        setUserState(nextUser);
        setSavedAccounts(loadSavedAccounts());
      };

      const handleLogout = () => {
        clearUser();
        setUserState(null);
        setSavedAccounts(loadSavedAccounts());
      };

      if (!user) {
        return <LandingLogin savedAccounts={savedAccounts} onLogin={handleLogin} />;
      }

      return (
        <>
          <Header />
          <div className="session-bar">
            <p>Ola, {user.name}! Estas dentro da tua conta.</p>
            <button className="session-logout" onClick={handleLogout}>Trocar de conta</button>
          </div>
          <SearchBox onSearch={handleSearch} onBack={handleGoBack} isBackDisabled={history.length === 0} />
          <QuickSuggestions items={quick} onSelect={handleSelect} onRefresh={loadQuick} />
          {loading && <p className="empty-state">Carregando...</p>}
          {!loading && current && (
            <AnimeCard anime={current} isFav={isFavorite(current.mal_id)} onAddFav={handleAddFav} onRemFav={handleRemFav} />
          )}
          {!loading && !current && <p className="empty-state">Pesquisa um anime para ver detalhes.</p>}
          <ResultsList items={results} onSelect={handleSelect} />
          <FavoritesList items={favs} onSelect={handleSelect} onRemove={handleRemFav} userName={user?.name} />
        </>
      );
    }

    // ========== RENDER ==========
    // Aqui renderiza o React na pÃ¡gina (no elemento .container)
    const root = ReactDOM.createRoot(document.querySelector(".container"));
    root.render(<App />);

    // ========== LOGIN & MUSIC (Vanilla JS) ==========
    // CÃ³digo JavaScript tradicional para funcionalidades fora do React
    const loginModal = null;
    const loginName = null;
    const loginEmail = null;
    const loginSave = null;
    const loginGoogle = null;
    const loginSkip = null;

    // Elementos de controlo de mÃºsica
    const bgMusic = document.getElementById("bgMusic");
    const musicToggle = document.getElementById("musicToggle");
    let isPlaying = false; // Estado para saber se estÃ¡ a tocar ou parado

    // Atualiza o texto do botÃ£o mÃºsica (Play â–¶ï¸ ou Pause â¸ï¸)
    function updateMusicButton() {
      musicToggle.textContent = isPlaying ? "Pause" : "Play";
    }

    // Tenta reproduzir a mÃºsica automaticamente ao carregar (alguns navegadores bloqueiam)
    function tryAutoPlay() {
      const playPromise = bgMusic.play();
      if (playPromise?.catch) {
        playPromise.catch(() => {
          isPlaying = false;
          updateMusicButton();
        });
      }
    }

    // Event listener: ao clicar no botÃ£o de mÃºsica, toca/pausa a mÃºsica de fundo
    musicToggle.addEventListener("click", () => {
      if (!isPlaying) {
        bgMusic.play();
        isPlaying = true;
      } else {
        bgMusic.pause();
        isPlaying = false;
      }
      updateMusicButton();
    });

    // Event listeners: atualiza o botÃ£o quando a mÃºsica pausa ou toca
    bgMusic.addEventListener("pause", () => { isPlaying = false; updateMusicButton(); });
    bgMusic.addEventListener("play", () => { isPlaying = true; updateMusicButton(); });

    // Event listener: botÃ£o "Guardar nome" no modal de login
    // Guarda os dados do utilizador e recarrega a pÃ¡gina para mostrar o nome
    if (loginSave) { }

    // ========== INICIALIZAÃ‡ÃƒO ==========
    // Mostra o modal de login se o utilizador nÃ£o estiver registado
    // Tenta reproduzir a mÃºsica de fundo (alguns navegadores podem bloquear)
    
    tryAutoPlay();

  </script>
